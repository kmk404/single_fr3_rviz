# Real FR3 controller configuration. The launch file selects this only in real mode.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      enforce_command_limits: true
      thread_priority: 97
      overruns:
        manage: false
        print_warnings: false
      joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

/**:
  joint_trajectory_controller:
    ros__parameters:
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity
      gains:
        fr3_joint1: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
        fr3_joint2: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
        fr3_joint3: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
        fr3_joint4: {p: 600.0, d: 30.0, i: 0.0, i_clamp: 1.0}
        fr3_joint5: {p: 250.0, d: 10.0, i: 0.0, i_clamp: 1.0}
        fr3_joint6: {p: 150.0, d: 10.0, i: 0.0, i_clamp: 1.0}
        fr3_joint7: {p: 50.0, d: 5.0, i: 0.0, i_clamp: 1.0}
      allow_partial_joints_goal: false
      action_monitor_rate: 20.0
      state_publish_rate: 100.0
      allow_nonzero_velocity_at_trajectory_end: false
      constraints:
        goal_time: 1.0
        stopped_velocity_tolerance: 0.02
        fr3_joint1: {trajectory: 0.10, goal: 0.05}
        fr3_joint2: {trajectory: 0.10, goal: 0.05}
        fr3_joint3: {trajectory: 0.10, goal: 0.05}
        fr3_joint4: {trajectory: 0.10, goal: 0.05}
        fr3_joint5: {trajectory: 0.10, goal: 0.05}
        fr3_joint6: {trajectory: 0.10, goal: 0.05}
        fr3_joint7: {trajectory: 0.10, goal: 0.05}

/**:
  joint_state_broadcaster:
    ros__parameters:
      update_rate: 100.0

/**:
  franka_robot_state_broadcaster:
    ros__parameters:
      convenience_publish_rate: 100.0
