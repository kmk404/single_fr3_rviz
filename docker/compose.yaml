services:
  single_fr3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: single-fr3-rviz:jazzy
    container_name: ${CONTAINER_NAME:-single_fr3_rviz}
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    ulimits:
      rtprio: 99
      memlock: -1
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-graphics,utility,display}
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /workspace
    # NVIDIA users may uncomment the next line. Intel/AMD rendering uses /dev/dri
    # when it is explicitly added on the command line or in a local compose override.
    # gpus: all

